<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C# Bricks</title>
<style>
:root{--bg:#f3f1fa;--pan:#fff;--ink:#3b3558;--line:#ddd8ee;--ws:#f7f6fc;--dot:#d3cde8;--code:#1c1a2b;--codeink:#e8e4ff;--acc:#7c4dff}
@media(prefers-color-scheme:dark){:root{--bg:#171524;--pan:#211e33;--ink:#e2defa;--line:#38334f;--ws:#1a182a;--dot:#2f2b48}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font:13px/1.4 "Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:var(--bg);display:grid;grid-template-rows:46px 1fr;overflow:hidden}
header{background:var(--acc);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px}
header h1{margin:0;font:800 20px "Trebuchet MS",sans-serif;letter-spacing:.5px}
header span{opacity:.85;margin-right:auto}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:6px 12px;background:var(--acc);color:#fff;font-weight:700}
header button{background:rgba(255,255,255,.2)}
main{display:grid;grid-template-columns:72px var(--sw,280px) 1fr var(--rw,430px);min-height:0}
#rail{background:var(--pan);border-right:1px solid var(--line);overflow:auto}
#rail button{display:block;width:100%;background:none;color:var(--ink);padding:8px 2px;font-size:11px;font-weight:600;border-radius:0}
#rail button:hover{background:var(--bg)}
#rail i{display:block;width:26px;height:26px;border-radius:50%;margin:0 auto 3px}
#side{display:flex;flex-direction:column;min-height:0;background:var(--pan);border-right:1px solid var(--line)}
#q{margin:10px;padding:8px 14px;border:1px solid var(--line);border-radius:20px;background:var(--bg);color:var(--ink);font:inherit}
#pal{overflow:auto;padding:0 12px 60px;flex:1}
#pal h4{margin:16px 0 4px;font-size:14px}
.pw{margin:7px 0}
#wsw{position:relative;min-height:0;min-width:0;overflow:hidden}#ws{position:absolute;inset:0;overflow:auto;background:var(--ws)}
#cv{position:relative;width:4000px;height:3000px;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:24px 24px}
#hint{position:fixed;bottom:10px;left:370px;font-size:11px;opacity:.6;pointer-events:none}
.top{position:absolute}
.stack{display:flex;flex-direction:column;align-items:flex-start}
.b{--c:#888;background:var(--c);color:#fff;font-weight:700;border:1px solid rgba(0,0,0,.22);border-radius:5px;display:inline-block;min-width:30px;cursor:grab;user-select:none;touch-action:none}
.row{padding:6px 9px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.sub{border-top:1px solid rgba(0,0,0,.15)}
.cb{margin-left:16px;background:rgba(0,0,0,.14)}
.cb .stack{min-height:26px;min-width:70px;padding:2px 0}
.foot{height:12px}
.kh,.km,.ku,.ka{border-radius:18px 18px 5px 5px;margin-top:6px}
.kr{border-radius:16px}.kr .row{padding:3px 9px}
.kp{border:0;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%)}.kp .row{padding:4px 14px}
.slot{display:inline-flex;align-items:center}
.slot.has{background:rgba(255,255,255,.25);border-radius:16px;padding:1px}
.slot input,.slot select{border:0;border-radius:12px;padding:2px 7px;font:600 12px "Trebuchet MS",sans-serif;color:#2b2540;background:#fff;min-width:28px;outline:0}
.slot input:focus,.slot select:focus{box-shadow:0 0 0 2px #ffd500}
.float{transform-origin:0 0;position:fixed;z-index:50;pointer-events:none;opacity:.93;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
#ind{position:fixed;z-index:40;pointer-events:none}
#ind.box{border:3px solid #ffd500;border-radius:14px}
#ind.line{background:#ffd500;border-radius:2px}
#tip{position:fixed;z-index:60;max-width:270px;background:#25203b;color:#fff;padding:9px 12px;border-radius:9px;font-size:12px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.35)}
#right{display:flex;flex-direction:column;min-height:0;background:var(--pan);border-left:1px solid var(--line)}
#bar{display:flex;gap:8px;padding:8px 10px;align-items:center;border-bottom:1px solid var(--line)}
#bar b{margin-right:auto}
#code{flex:1;margin:0;background:var(--code);color:var(--codeink);padding:14px;overflow:auto;font:12.5px/1.55 ui-monospace,Consolas,monospace;white-space:pre;tab-size:4}
#set{padding:12px;display:grid;gap:9px;border-top:1px solid var(--line)}
#set label{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:8px;font-weight:700}
#set input,#set select{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}

:root{--sw:280px;--rw:430px}
#side,#right{position:relative}#cv{transform-origin:0 0}#hint{left:calc(var(--sw) + 110px)}
.rz{position:absolute;top:0;bottom:0;width:8px;right:-4px;cursor:col-resize;z-index:30}.rz.l{right:auto;left:-4px}.rz:hover{background:var(--acc);opacity:.45}
#zoom{position:absolute;right:18px;bottom:16px;display:flex;align-items:center;gap:6px;background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:4px 6px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
#zoom button{width:30px;padding:3px 0;font-size:18px;line-height:1}#zoom span{min-width:42px;text-align:center;font-weight:700}
#al{display:flex;align-items:center;gap:5px;font-weight:700;margin:0 6px;cursor:pointer}#sv{min-width:74px}
#dlg{position:fixed;inset:0;z-index:100;background:rgba(20,16,40,.55);display:grid;place-items:center}
#dlg .card{width:min(640px,92vw);max-height:80vh;background:var(--pan);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
#dlg .hd{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}#dlg .hd b{font-size:15px}
#sq{flex:1;padding:7px 12px;border:1px solid var(--line);border-radius:18px;background:var(--bg);color:var(--ink);font:inherit}
#sl{overflow:auto;padding:8px 12px 14px}.si{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px}.si:hover{background:var(--bg)}.si.on{outline:2px solid var(--acc)}
.si>div{flex:1;display:grid}.si small{opacity:.6}#dot{width:14px;height:14px;flex:none;border-radius:50%;background:#2ecc71;box-shadow:0 0 0 3px rgba(46,204,113,.25);cursor:help}#dot.bad{background:#e5484d;box-shadow:0 0 0 3px rgba(229,72,77,.25)}
.si .del{background:#e5484d}
body.trash #side::after{content:"🗑";position:absolute;inset:0;display:grid;place-items:center;font-size:72px;background:rgba(229,72,77,.82);z-index:20;pointer-events:none}
</style></head>
<body>
<header><h1>C# Bricks</h1><span>Drag blocks, get a Unity script</span><button id="un" title="Undo (Ctrl+Z)">↶ Undo</button><button id="re" title="Redo (Shift+Ctrl+Z)">↷ Redo</button><button id="sv" title="Save (Ctrl+S)">Saved</button><button id="op">Open</button><label id="al"><input type="checkbox" id="au" checked> Auto save</label><button id="clr">Clear all</button></header>
<main>
<nav id="rail"></nav>
<section id="side"><div class="rz" id="rz1"></div><input id="q" type="search" placeholder="Search blocks…"><div id="pal"></div></section>
<section id="wsw"><div id="ws"><div id="zw"><div id="cv"></div></div></div><div id="zoom"><button id="zo">−</button><span id="zp">100%</span><button id="zi">+</button></div></section>
<aside id="right"><div class="rz l" id="rz2"></div>
<div id="bar"><i id="dot" title="Green = no errors found."></i><b id="fn">NewScript.cs</b><button id="cp">Copy</button><button id="dl">Download</button></div>
<pre id="code"></pre>
<div id="set"><label>Script name<input id="nm" value="NewScript" spellcheck="false"></label><label>Type<select id="bs"></select></label><label>Namespace<input id="ns" placeholder="optional" spellcheck="false"></label></div>
</aside>
</main>
<div id="hint">Drag blocks in · right-click or press Delete on a block to remove it · drag it onto the block list (trash icon) to delete · dropping anywhere else puts it back</div>
<div id="dlg" hidden><div class="card"><div class="hd"><b>My scripts</b><input id="sq" placeholder="Search scripts…"><button id="nw">New</button><button id="xx">Close</button></div><div id="sl"></div></div></div><div id="ind" hidden></div><div id="tip" hidden></div><datalist id="types"></datalist>
<script>
const $=s=>document.querySelector(s),el=(t,c,p)=>{const e=document.createElement(t);if(c)e.className=c;if(p)p.append(e);return e};
const TOK=/\[(\w):([^\]]*)\]/g,D={},CATS=[],MK='hmua';
const TYPES='int float double bool string char long short byte uint object var void Vector2 Vector3 Vector4 Quaternion Color GameObject Transform Rigidbody Rigidbody2D Collider Collider2D Camera AudioSource AudioClip Animator Renderer Material Sprite Texture2D Canvas Image Button TMP_Text Light Mesh CharacterController NavMeshAgent Component MonoBehaviour ScriptableObject Action Func<int> IEnumerator List<int> List<string> List<GameObject> Dictionary<string,int> int[] float[] string[] GameObject[]'.split(' ');
TYPES.forEach(t=>{el('option','',$('#types')).value=t});
function add(c,k,label,code,tip){const tok=[];let n=0;
 const parts=label.replace(TOK,(m,a,b)=>(tok.push({k:a,d:b}),'\u0001')).split('\u0001');
 if(code==null){code=label.replace(TOK,()=>'$'+(++n));if(k=='s'||k=='m')code+=';'}
 const id=k+label,tg=(k=='p'?' bool boolean':'')+tok.map(t=>({b:' bool boolean',s:' string text',n:' number int float',t:' type'}[t.k]||'')).join('')+({Strings:' string text',Lists:' list array collection',Math:' number int float',Transform:' vector position rotation',Input:' input key mouse',Physics:' physics rigidbody force'}[c.n]||'');
 D[id]={id,c,k,label,parts,tok,code,tip:tip||'Inserts: '+code,ix:(label+' '+(tip||'')+' '+c.n+tg).toLowerCase()};c.ids.push(id)}
const cat=(n,col)=>{const c={n,col,ids:[]};CATS.push(c);
 c.A=a=>a.forEach(x=>add(c,...x));
 c.L=t=>t.trim().split('\n').forEach(l=>{let k='r';if(l[0]=='?'||l[0]=='!'){k=l[0]=='?'?'p':'s';l=l.slice(1)}const[a,b]=l.split('::');add(c,k,a.trim(),null,b)});
 c.E=t=>t.trim().split('\n').forEach(l=>{const[a,b]=l.split('::');add(c,'h',a.trim(),'void '+a.trim(),b)});
 c.F=(pre,spec)=>spec.split(';').forEach(s=>{const[n,a,t,k]=s.split(':');add(c,k||'r',pre+'.'+n+'('+[...Array(+a)].map(()=>'[n:0]').join(', ')+')',null,t)});
 return c};

const S=cat('Script','#9966ff');
S.A([
['u','using [i:UnityEngine.UI]','using $1;','Imports a namespace at the top of the file. Common ones are added automatically.'],
['a','RequireComponent [t:Rigidbody]','[RequireComponent(typeof($1))]','Unity adds this component automatically when the script is attached.'],
['a','DisallowMultipleComponent','[DisallowMultipleComponent]','Only one copy of this script can be on a GameObject.'],
['a','ExecuteAlways','[ExecuteAlways]','Runs the script in edit mode as well as play mode.'],
['a','AddComponentMenu [s:Custom/MyScript]','[AddComponentMenu($1)]','Places the script in the Add Component menu.'],
['a','CreateAssetMenu file [s:NewAsset] menu [s:My/Asset]','[CreateAssetMenu(fileName = $1, menuName = $2)]','Lets you create this ScriptableObject from the Assets menu.'],
['m','enum [i:State] { [e:Idle, Walk, Run] }','public enum $1 { $2 }','Declares an enum inside the class.'],
['h','[d:public,private,protected,internal,public static,private static] [t:void] [i:MyMethod]([e:])','$1 $2 $3($4)','Defines a method. Put the blocks it runs inside.'],
['h','coroutine [i:MyRoutine]([e:])','IEnumerator $1($2)','A coroutine method that can wait with yield blocks. Start it with StartCoroutine.'],
['h','async Task [i:DoWork]([e:])','async Task $1($2)','An async method. Add using System.Threading.Tasks is automatic.'],
['s','// [e:comment]','// $1','A comment line that is ignored by C#.']]);

const E=cat('Events','#e6b800');
E.E(`Awake()::Runs once when the script loads, before Start.
Start()::Runs once before the first frame.
Update()::Runs every frame.
FixedUpdate()::Runs on a fixed timestep, best for physics.
LateUpdate()::Runs every frame after all Update calls, good for cameras.
OnEnable()::Runs when the object or script becomes enabled.
OnDisable()::Runs when the object or script becomes disabled.
OnDestroy()::Runs when the object is destroyed.
OnGUI()::Draws immediate-mode GUI each event.
OnValidate()::Runs in the editor when a value changes in the Inspector.
Reset()::Runs in the editor when the script is first added or reset.
OnApplicationQuit()::Runs when the app is closing.
OnApplicationPause(bool pause)::Runs when the app pauses or resumes.
OnApplicationFocus(bool focus)::Runs when the app gains or loses focus.
OnCollisionEnter(Collision collision)::Runs when this collider starts touching another.
OnCollisionStay(Collision collision)::Runs every physics step while touching.
OnCollisionExit(Collision collision)::Runs when a collision ends.
OnTriggerEnter(Collider other)::Runs when something enters this trigger.
OnTriggerStay(Collider other)::Runs every physics step while something is in the trigger.
OnTriggerExit(Collider other)::Runs when something leaves the trigger.
OnCollisionEnter2D(Collision2D collision)::2D version of OnCollisionEnter.
OnCollisionExit2D(Collision2D collision)::2D version of OnCollisionExit.
OnTriggerEnter2D(Collider2D other)::2D version of OnTriggerEnter.
OnTriggerExit2D(Collider2D other)::2D version of OnTriggerExit.
OnMouseDown()::Runs when the mouse is pressed on this collider.
OnMouseUp()::Runs when the mouse is released.
OnMouseEnter()::Runs when the mouse moves onto this collider.
OnMouseExit()::Runs when the mouse leaves this collider.
OnBecameVisible()::Runs when a renderer becomes visible to a camera.
OnBecameInvisible()::Runs when no camera sees the renderer anymore.
OnDrawGizmos()::Draw debug shapes in the Scene view.
OnDrawGizmosSelected()::Draw debug shapes only when selected.
OnParticleCollision(GameObject other)::Runs when a particle hits this object.
OnControllerColliderHit(ControllerColliderHit hit)::Runs when a CharacterController hits something.`);

const V=cat('Variables','#ff8c1a');
V.A([
['m','public [t:int] [i:myVar] = [e:0]',null,'Public field. Shows in the Inspector and other scripts can use it.'],
['m','private [t:int] [i:myVar] = [e:0]',null,'Private field only this script can use.'],
['m','[SerializeField] private [t:GameObject] [i:myObj]','[SerializeField] private $1 $2;','Private field that still shows in the Inspector.'],
['m','public static [t:int] [i:count] = [e:0]',null,'Static field shared by every copy of the script.'],
['m','const [t:int] [i:MAX] = [e:10]','private const $1 $2 = $3;','A constant that can never change.'],
['m','readonly [t:int] [i:id] = [e:1]','private readonly $1 $2 = $3;','A field that can only be set once.'],
['m','public [t:int] [i:Score] { get; private set; }','public $1 $2 { get; private set; }','Property with a public getter and private setter.'],
['m','event [t:Action] [i:OnDone]','public event $1 $2;','An event other scripts can subscribe to.'],
['m','[Header([s:Settings])]','[Header($1)]','Draws a bold title above the next field in the Inspector.'],
['m','[Range([n:0], [n:10])]','[Range($1, $2)]','Shows the next field as a slider.'],
['m','[SerializeField]','[SerializeField]','Attribute for the next field to show it in the Inspector.'],
['m','[HideInInspector]','[HideInInspector]','Hides the next public field in the Inspector.'],
['m','[Space]','[Space]','Adds a gap before the next field in the Inspector.'],
['m','[Serializable]','[Serializable]','Marks the next type so Unity can save it.']]);
V.L(`![t:var] [i:x] = [e:0]::Creates a local variable inside a method.
![i:x] = [e:0]::Sets a variable to a new value.
![i:x] += [e:1]::Adds to a variable.
![i:x] -= [e:1]::Subtracts from a variable.
![i:x]++::Adds 1 to a variable.
![i:x]--::Subtracts 1 from a variable.
![i:x] [d:*=,/=,%=,??=,&=,|=,^=] [e:2]::Other compound assignments.
[i:myVar]::Reads a variable. Type its name.
[e:obj].[i:field]::Reads a field or property of an object.
this::The current script instance.
base::The parent class.`);

[['bool','[b:false]'],['string','[s:text]'],['int','[n:0]'],['float','[n:0]'],['Vector3','[e:Vector3.zero]'],['GameObject','[e:null]']].forEach(([t,v])=>['public','private',''].forEach(a=>add(V,a?'m':'s',(a?a+' ':'')+t+' [i:my'+t[0].toUpperCase()+t.slice(1)+'] = '+v,null,(a||'Local')+' '+t+' variable with a starting value.')));
const C=cat('Control','#f59e0b');
C.A([
['c','if [b:true]','if ($1)','Runs the blocks inside only when the condition is true.'],
['c','if [b:true] else','if ($1)@@else','Runs the first group when true, the second group when false.'],
['c','else if [b:true]','else if ($1)','Place right under an if. Runs when its own condition is true.'],
['c','else','else','Place right under an if. Runs when nothing above matched.'],
['c','for [t:int] [i:i] from [n:0] while less than [n:10]','for ($1 $2 = $3; $2 < $4; $2++)','Counts up and repeats the blocks each time.'],
['c','foreach [t:var] [i:item] in [e:list]','foreach ($1 $2 in $3)','Repeats once for every item in a list or array.'],
['c','while [b:true]','while ($1)','Repeats while the condition stays true.'],
['c','switch [e:value]','switch ($1)','Picks a case based on a value. Put case blocks inside.'],
['c','case [e:1]','case $1:','One branch of a switch. End it with a break block.'],
['c','default','default:','The branch of a switch used when no case matches.'],
['c','try, catch [i:ex]','try@@catch (Exception $1)','Runs code and catches errors in the second group.'],
['c','try, catch, finally','try@@catch (Exception ex)@@finally','Try, catch errors, and always run the finally group.'],
['c','using ([e:var x = new Foo()])','using ($1)','Disposes the object when the group ends.'],
['c','lock ([e:this])','lock ($1)','Makes sure only one thread runs the group at a time.']]);
C.L(`!return::Exits the method.
!return [e:0]::Exits the method and gives back a value.
!break::Leaves the current loop or switch case.
!continue::Skips to the next loop round.
!yield return null::In a coroutine, waits one frame.
!yield return new WaitForSeconds([n:1])::In a coroutine, waits some seconds.
!yield return new WaitForEndOfFrame()::In a coroutine, waits until the frame has been drawn.
!yield return new WaitForFixedUpdate()::In a coroutine, waits for the next physics step.
!yield return new WaitUntil(() => [e:ready])::In a coroutine, waits until the condition is true.
!yield break::Ends a coroutine early.
!StartCoroutine([e:MyRoutine()])::Starts a coroutine.
!StopAllCoroutines()::Stops every coroutine on this script.
!Invoke([s:MyMethod], [n:1])::Calls a method by name after a delay in seconds.
!InvokeRepeating([s:MyMethod], [n:1], [n:1])::Calls a method by name repeatedly.
!CancelInvoke()::Cancels all Invoke calls on this script.
!throw new Exception([s:Error])::Raises an error.
![i:MyMethod]([e:])::Calls a method you made. Type its name and arguments.`);

const O=cat('Operators','#40bf4a');
[['==','p'],['!=','p'],['<','p'],['>','p'],['<=','p'],['>=','p'],['&&','p'],['||','p'],['+','r'],['-','r'],['*','r'],['/','r'],['%','r'],['&','r'],['|','r'],['^','r'],['<<','r'],['>>','r'],['??','r']]
.forEach(([o,k])=>add(O,k,`[e:a] ${o} [e:b]`,`($1 ${o} $2)`,`Combines two values with ${o}.`));
O.A([
['p','not [e:x]','(!$1)','Flips true to false and false to true.'],
['p','[b:true]','$1','A true or false value.'],
['r','[n:0]','$1','A number.'],
['r','[s:text]','$1','A piece of text.'],
['r','null','null','No object.'],
['r','[e:cond] ? [e:a] : [e:b]','($1 ? $2 : $3)','Gives a when the condition is true, otherwise b.'],
['r','([t:float]) [e:x]','(($1)$2)','Converts a value to another type.'],
['p','[e:x] is [t:GameObject]','($1 is $2)','True if x is that type.'],
['r','[e:x] as [t:GameObject]','($1 as $2)','Converts x to that type, or null if it is not one.'],
['r','typeof([t:GameObject])','typeof($1)','The Type object of a type.'],
['r','default([t:int])','default($1)','The default value of a type.'],
['r','nameof([e:x])','nameof($1)','The name of a variable or member as text.'],
['r','$"[e:Hi {name}]"','$"$1"','Text with variables inside {braces}.'],
['r','new [t:Vector3]([e:])','new $1($2)','Creates a new object of a type.'],
['r','() => [e:x]','() => $1','A lambda with no parameters.'],
['r','([i:a]) => [e:a * 2]','($1) => $2','A lambda with a parameter.']]);

const M=cat('Math','#0fbd8c');
M.F('Mathf','Abs:1:Absolute value.;Sqrt:1:Square root.;Pow:2:First number raised to the second.;Min:2:The smaller value.;Max:2:The larger value.;Clamp:3:Limits a value between a min and max.;Clamp01:1:Limits a value between 0 and 1.;Lerp:3:Blends from a to b by t (0 to 1).;InverseLerp:3:Where a value sits between a and b (0 to 1).;MoveTowards:3:Steps a value toward a target by a max amount.;Round:1:Rounds to the nearest whole number.;Floor:1:Rounds down.;Ceil:1:Rounds up.;FloorToInt:1:Rounds down to an int.;RoundToInt:1:Rounds to an int.;CeilToInt:1:Rounds up to an int.;Sin:1:Sine (radians).;Cos:1:Cosine (radians).;Tan:1:Tangent (radians).;Atan2:2:Angle in radians from y and x.;Sign:1:-1 or 1 depending on sign.;PingPong:2:Bounces a value back and forth.;Repeat:2:Wraps a value around a length.;Approximately:2:True if two floats are nearly equal.:p');
M.F('Random','Range:2:Random number from min up to max.');
M.L(`Mathf.PI::Pi.
Mathf.Infinity::Positive infinity.
Mathf.Deg2Rad::Multiply degrees by this to get radians.
Mathf.Rad2Deg::Multiply radians by this to get degrees.
Random.value::Random float from 0 to 1.
Random.insideUnitSphere::Random point inside a sphere of radius 1.
Random.insideUnitCircle::Random point inside a circle of radius 1.
Random.rotation::A random rotation.
Vector3.Distance([e:a], [e:b])::Distance between two points.
Vector3.Dot([e:a], [e:b])::Dot product.
Vector3.Cross([e:a], [e:b])::Cross product.`);

const T=cat('Strings','#e84c8a');
T.L(`[e:text].Length::Number of characters.
[e:text].ToUpper()::Uppercase copy.
